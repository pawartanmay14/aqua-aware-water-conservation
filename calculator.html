<main><section class="page-header"><h1>Water Footprint Calculator</h1><p>Estimate daily water use from everyday activities.</p></section>
<section class="section calculator-wrap"><form id="waterForm" class="calculator card">
<label for="shower">Showers per day (minutes)</label><input type="number" id="shower" min="0" placeholder="e.g. 10">
<label for="flush">Toilet flushes per day</label><input type="number" id="flush" min="0" placeholder="e.g. 5">
<label for="laundry">Clothes washed per week</label><input type="number" id="laundry" min="0" placeholder="e.g. 3">
<label for="drink">Drinking water (liters per day)</label><input type="number" id="drink" min="0" step="0.1" placeholder="e.g. 2">
<button class="btn" type="submit">Calculate Footprint</button></form><div id="result" class="result-box" aria-live="polite"></div></section></main>
